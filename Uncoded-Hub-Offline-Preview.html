<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════
         PRIMARY SEO
         Industry-neutral. These must match the visible copy —
         a mismatch between metadata and page content is the
         fastest way to lose both rankings and trust.
    ═══════════════════════════════════════════════════════ -->
    <title>Uncoded Hub — Business Websites, Built in Seven Days</title>
    <meta name="title" content="Uncoded Hub — Business Websites, Built in Seven Days">
    <meta name="description" content="A web design and development studio. We design and build fast, clear business websites on a fixed price and a seven-day schedule. Late means free.">
    <meta name="author" content="Uncoded Hub">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
    <link rel="canonical" href="https://uncodedhub.com/">

    <!-- ═══════════════════════════════════════════════════════
         OPEN GRAPH / TWITTER
         Note: these are the static fallback for crawlers that do
         not execute JS. Per-page values are set via Helmet.
    ═══════════════════════════════════════════════════════ -->

    <meta property="og:url" content="https://uncodedhub.com/">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:image" content="https://uncodedhub.com/og-image.jpg">

 elapsed time is mostly queue: your project sitting behind four others, waiting on a designer who is on two other accounts, waiting for a weekly status call. We are two people working to a fixed scope with no other meetings, so a week of calendar time is close to a week of actual work. If your project genuinely needs longer, we quote longer."},{q:"What do you need from me, and how much of my time will it take?",a:"About three hours in total across the week. A ninety-minute discovery call at the start, then two rounds of feedback — one on the copy on day two, one on the design on day four — each of which takes most clients under an hour. We also need your logo and brand files, and access to your domain registrar. That is the whole ask."},{q:"Can I edit the site myself after it launches?",a:"Yes. Content lives in a simple editor you log into, and we record a walkthrough of your specific site — not a generic tutorial — so you can change text, swap images, and add pages without calling us. Structural changes are still worth asking us about, but you are never locked out of your own content."},{q:"Who owns the site, the domain, and the hosting?",a:"You do, from day one. We set the domain and hosting up in your name on your own accounts rather than reselling them to you, and you get the code. If you ever move to another studio, nothing in the way we build is designed to make that difficult or expensive."},{q:"What happens if I do not like the design?",a:"You see it on day four, with your real copy in it, while there is still time to change direction. Revision rounds are included in every scope. If we are genuinely not converging after those rounds, we would rather refund the deposit and part on good terms than hand over something you are not happy to put your name on."},{q:"Do you work with businesses outside India?",a:"Yes. We work remotely with clients in India, the UK, the US, the UAE and elsewhere. Calls are booked in your timezone. The only practical constraint is tha ,m.jsxs(Z,{delay:100,className:"lg:col-span-7",children:[m.jsx(tt,{index:"01",eyebrow:"Why this exists",title:"The same failure, over and over."}),m.jsxs("div",{className:"mt-8 space-y-5 text-muted leading-relaxed max-w-xl",children:[m.jsx("p",{children:"The pattern was always identical. A business that genuinely knew what it was doing — a clinic, a manufacturer, a firm with twenty years behind it — losing enquiries to a younger, thinner competitor. Not because the competitor was better. Because their site loaded in one second and said what they did in the first sentence."}),m.jsx("p",{children:"The reason it kept happening is unglamorous. A proper website from a proper agency took three months and cost more than most of these businesses could justify for something they could not measure. So they either bought a template and let it rot, or they did nothing."}),m.jsx("p",{children:"We built the studio around removing that trade-off: the standard of work an agency would produce, on a schedule and at a price a real small business can actually say yes to. The seven days is not a gimmick. It is what falls out of two people who do this full time, working to a fixed scope, with no meetings to attend but yours."})]})]})]})})}),m.jsx(Le,{tone:"ink",size:"loose",children:m.jsxs(ye,{children:[m.jsx(Z,{children:m.jsx(tt,{index:"02",eyebrow:"Who does what",title:"Design and build, split cleanly.",inverted:!0})}),m.jsxs("div",{className:"grid md:grid-cols-2 gap-px bg-rule-on-ink mt-20 border border-rule-on-ink",children:[m.jsxs(Z,{className:"bg-ink p-8 md:p-12",children:[m.jsx("span",{className:"label text-signal-bright",children:"Co-founder · Engineering"}),m.jsx("h3",{className:"font-display text-display mt-5",children:"Deepak"}),m.jsxs("div",{className:"mt-8 space-y-5 text-on-ink-muted leading-relaxed",children:[m.jsx("p",{children:"Runs discovery, information architecture, and the build. He is the one who decides how your site is structured, what it is made of, and why it loa
