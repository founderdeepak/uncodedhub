<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Film Rebate Frame -->
  <rect x="15" y="15" width="170" height="170" rx="4" stroke="#E2B180" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Lens Circle Outer -->
  <circle cx="100" cy="100" r="72" stroke="#E2B180" stroke-width="2"/>
  <!-- Aperture Blades (Hexagonal f/1.4 Geometric lines) -->
