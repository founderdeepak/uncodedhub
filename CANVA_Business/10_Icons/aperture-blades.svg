  <line x1="100" y1="28" x2="143" y2="75" stroke="#E2B180" stroke-width="1.5"/>
  <line x1="172" y1="100" x2="143" y2="125" stroke="#E2B180" stroke-width="1.5"/>
  <line x1="100" y1="172" x2="57" y2="125" stroke="#E2B180" stroke-width="1.5"/>
  <line x1="28" y1="100" x2="57" y2="75" stroke="#E2B180" stroke-width="1.5"/>
  <!-- Center Optical Glow -->
  <circle cx="100" cy="100" r="8" fill="#E2B180"/>
