<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Matrix Border -->
  <rect x="20" y="20" width="160" height="160" stroke="#854D0E" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Coordinate Axis -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="#854D0E" stroke-width="2"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#854D0E" stroke-width="2"/>
  <!-- High Leverage Top-Right Focus Quadrant -->
  <rect x="100" y="20" width="80" height="80" fill="#854D0E" fill-opacity="0.25"/>
  <!-- Upward Trajectory Vector Arrow -->
  <line x1="40" y1="160" x2="160" y2="40" stroke="#854D0E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Star Target Node in Top Right -->
  <circle cx="150" cy="50" r="7" fill="#854D0E"/>
  <circle cx="150" cy="50" r="14" stroke="#854D0E" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>