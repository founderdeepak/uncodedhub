<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Precision Caliper Ticks -->
  <circle cx="100" cy="100" r="55" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Crosshairs -->
  <line x1="10" y1="100" x2="190" y2="100" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="100" y1="10" x2="100" y2="190" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Anatomical Aesthetic Arch (Teeth Arc curve) -->
  <path d="M 50 135 C 50 70 150 70 150 135" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center Target Point -->
  <circle cx="100" cy="100" r="6" fill="#0284C7"/>
</svg>