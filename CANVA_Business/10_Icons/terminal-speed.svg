<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Dark Terminal Window Frame -->
  <rect x="15" y="15" width="170" height="170" rx="4" stroke="#FF3B00" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Window Control Dots -->
  <circle cx="35" cy="35" r="4" fill="#FF3B00"/>
  <circle cx="48" cy="35" r="4" fill="#FF3B00" fill-opacity="0.4"/>
  <circle cx="61" cy="35" r="4" fill="#FF3B00" fill-opacity="0.2"/>
  <!-- Divider -->
  <line x1="15" y1="50" x2="185" y2="50" stroke="#FF3B00" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Terminal Prompt Brackets `[ /> ]` -->
  <text x="32" y="115" font-family="monospace" font-size="44" font-weight="bold" fill="#FF3B00">&gt;_</text>
  <!-- Latency Gauge Sub-second Wave -->
  <path d="M 32 145 L 65 145 L 85 125 L 105 160 L 125 135 L 140 145 L 168 145" stroke="#FF3B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>