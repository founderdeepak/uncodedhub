<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Outer Box -->
  <rect x="15" y="15" width="170" height="170" stroke="#334155" stroke-width="1.5"/>
  <!-- Cadastral Plot Boundary Lines -->
  <line x1="15" y1="90" x2="185" y2="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="100" y1="15" x2="100" y2="185" stroke="#334155" stroke-width="1.5"/>
  <!-- Structural High-Rise Silhouette -->
  <rect x="40" y="45" width="40" height="110" stroke="#D97706" stroke-width="2"/>
  <rect x="80" y="25" width="50" height="130" stroke="#D97706" stroke-width="2" fill="#D97706" fill-opacity="0.15"/>
  <rect x="130" y="65" width="35" height="90" stroke="#D97706" stroke-width="2"/>
  <!-- Accent Point -->
  <circle cx="105" cy="50" r="4" fill="#D97706"/>
</svg>