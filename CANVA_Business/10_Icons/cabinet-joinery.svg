<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- Blueprint Grid Box -->
  <rect x="15" y="15" width="170" height="170" stroke="#525252" stroke-width="1.5"/>
  <line x1="15" y1="60" x2="185" y2="60" stroke="#525252" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="15" y1="105" x2="185" y2="105" stroke="#525252" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="15" y1="150" x2="185" y2="150" stroke="#525252" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Isometric Cabinet Cube -->
  <!-- Top Face -->
  <polygon points="100,45 150,70 100,95 50,70" stroke="#EA580C" stroke-width="2" fill="#EA580C" fill-opacity="0.2"/>
  <!-- Left Face -->
  <polygon points="50,70 100,95 100,155 50,130" stroke="#EA580C" stroke-width="2"/>
  <!-- Right Face -->
  <polygon points="100,95 150,70 150,130 100,155" stroke="#EA580C" stroke-width="2" fill="#EA580C" fill-opacity="0.1"/>
  <!-- Millimeter Caliper Arrow -->
  <line x1="165" y1="70" x2="165" y2="130" stroke="#EA580C" stroke-width="1.5"/>
  <circle cx="165" cy="70" r="2.5" fill="#EA580C"/>
  <circle cx="165" cy="130" r="2.5" fill="#EA580C"/>
</svg>