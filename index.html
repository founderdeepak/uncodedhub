<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════
         PRIMARY SEO
         title / description / canonical are intentionally NOT set
         here — every route sets them via <Helmet> (see src/pages/*),
         including the 404 route. A static placeholder here would sit
         alongside Helmet's tag rather than being replaced by it
         (Helmet only manages tags it renders), producing two <title>
         and two canonical elements per page. The prerender step
         (scripts/prerender.mjs) bakes each route's real Helmet output
         into its own static HTML file, so there is no window where a
         crawler sees this file un-prerendered.
    ═══════════════════════════════════════════════════════ -->
    <meta name="author" content="Uncoded Hub">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">

    <!-- ═══════════════════════════════════════════════════════
         OPEN GRAPH / TWITTER
         Static fallback shared by every route — not overridden
         per-page by Helmet, so social previews are homepage-generic
         until per-page OG images/descriptions are added (tracked
         separately; not a correctness bug, just not page-specific yet).
    ═══════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://uncodedhub.com/">
    <meta property="og:title" content="Uncoded Hub — Business Websites, Built in Seven Days">
    <meta property="og:description" content="A web design and development studio. Fixed price, seven-day schedule, terms published in full. Late means free.">
    <meta property="og:image" content="https://uncodedhub.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Uncoded Hub — web design and development studio">
    <meta property="og:site_name" content="Uncoded Hub">
    <meta property="og:locale" content="en_IN">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@uncodedhub">
    <meta name="twitter:title" content="Uncoded Hub — Business Websites, Built in Seven Days">
    <meta name="twitter:description" content="A web design and development studio. Fixed price, seven-day schedule, terms published in full. Late means free.">
    <meta name="twitter:image" content="https://uncodedhub.com/og-image.jpg">

    <!-- ═══════════════════════════════════════════════════════
         TECHNICAL
    ═══════════════════════════════════════════════════════ -->
    <meta name="theme-color" content="#f5f3ef">
    <link rel="icon" type="image/png" href="/logo-small.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Typography is the identity here, so the two above-the-fold faces
         (the hero serif and the body sans) are preloaded from the same
         origin — see src/index.css for why these are self-hosted rather
         than pulled from Google Fonts. -->
    <link rel="preload" href="/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/instrument-sans-400.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preload hero image for fast LCP on both mobile and desktop viewports -->
    <link rel="preload" href="/hero-section-mobile.webp" as="image" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
    <link rel="preload" href="/hero-section.webp" as="image" type="image/webp" media="(min-width: 768px)" fetchpriority="high">

    <!-- Analytics loads deferred (after window 'load', see the script at
         the bottom of <head>) so it never competes with first paint —
         but Lighthouse still measured ~590ms lost to the DNS+TLS
         handshake for these two domains once it does load, since
         nothing had warmed the connection. Preconnecting costs nothing
         if the browser never uses it. -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">

    <!-- ═══════════════════════════════════════════════════════
         STRUCTURED DATA
         Only claims we can stand behind. No aggregateRating and no
         review markup until there are real, attributable reviews.
    ═══════════════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://uncodedhub.com/#organization",
      "name": "Uncoded Hub",
      "alternateName": "UncodedHub",
      "url": "https://uncodedhub.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://uncodedhub.com/logo-large.webp"
      },
      "description": "Uncoded Hub is a web design and development studio. We design and build business websites on a fixed price and a seven-day schedule.",
      "foundingDate": "2024",
      "email": "hello@uncodedhub.com",
      "telephone": "+91-8660819023",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-8660819023",
        "email": "hello@uncodedhub.com",
        "contactType": "sales",
        "areaServed": ["IN", "GB", "US", "AE"]
      },
      "founder": [
        { "@type": "Person", "name": "Deepak", "jobTitle": "Co-Founder, Engineering" },
        { "@type": "Person", "name": "Geetha", "jobTitle": "Co-Founder, Design" }
      ],
      "sameAs": [
        "https://www.instagram.com/uncodedhub/",
        "https://www.linkedin.com/company/uncodedhub/",
        "https://www.youtube.com/@uncodedhub",
        "https://www.facebook.com/people/Uncoded-Hub/61580702457181/"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://uncodedhub.com/#website",
      "name": "Uncoded Hub",
      "url": "https://uncodedhub.com",
      "publisher": { "@id": "https://uncodedhub.com/#organization" },
      "inLanguage": "en"
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "Web design and development",
      "provider": { "@id": "https://uncodedhub.com/#organization" },
      "name": "Seven-day website build",
      "description": "Design and development of a business website delivered on a fixed price and a seven-day schedule, including performance work, on-page SEO groundwork, and thirty days of post-launch support.",
      "areaServed": [
        { "@type": "Country", "name": "India" },
        { "@type": "Country", "name": "United Kingdom" },
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "United Arab Emirates" }
      ],
      "audience": { "@type": "BusinessAudience", "audienceType": "Small and mid-sized businesses" }
    }
    </script>

    <!-- Google Analytics, loaded deferred after the page is interactive, skipped during static prerender -->
    <script>
      (function () {
        if (navigator.webdriver || /HeadlessChrome/i.test(navigator.userAgent)) return;
        function loadGtag() {
          if (window.__gtag_loaded) return;
          window.__gtag_loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9KBM90K2TM';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag() { dataLayer.push(arguments); }
          gtag('js', new Date());
          gtag('config', 'G-9KBM90K2TM');
          window.gtag = gtag;
        }
        if ('requestIdleCallback' in window) {
          window.addEventListener('load', function () { requestIdleCallback(loadGtag, { timeout: 3000 }); });
        } else {
          window.addEventListener('load', function () { setTimeout(loadGtag, 2000); });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
