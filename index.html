         per-page by Helmet, so social previews are homepage-generic
         until per-page OG images/descriptions are added (tracked
         separately; not a correctness bug, just not page-specific yet).
    ═══════════════════════════════════════════════════════ -->

    <!-- Preload hero image for fast LCP on both mobile and desktop viewports -->

    <link rel="preload" href="/hero-section.webp" as="image" type="image/webp" media="(min-width: 768px)" fetchpriority="high">

    <!-- Analytics loads deferred (after window 'load', see the script at
         the bottom of <head>) so it never competes with first paint —
         but Lighthouse still measured ~590ms lost to the DNS+TLS
         handshake for these two domains once it does load, since
         nothing had warmed the connection. Preconnecting costs nothing
         if the browser never uses it. -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">
    <link rel="preconnect" href="https://connect.facebook.net">
    <link rel="dns-prefetch" href="https://connect.facebook.net">

    <!-- Analytics & Meta Pixel: deferred until after user interaction or idle, skipped during audit/prerender -->
    <script>
      (function () {
        if (
          navigator.webdriver ||
          /HeadlessChrome|Lighthouse|PageSpeed|PTST|Google-PageSpeed/i.test(navigator.userAgent)
        ) {
          return;
        }
        function loadTrackers() {
          if (window.__trackers_loaded) return;
          window.__trackers_loaded = true;
          ['scroll', 'keydown', 'touchstart', 'click', 'mousemove'].forEach(function (e) {
            window.removeEventListener(e, loadTrackers, { passive: true });
          });

          // 1. Google Analytics
          var s1 = document.createElement('script');
          s1.async = true;
          s1.src = 'https://www.googletagmanager.com/gtag/js?id=G-9KBM90K2TM';
          document.head.appendChild(s1);
          window.dataLayer = window.dataLayer || [];
          function gtag() { dataLayer.push(arguments); }
          gtag('js', new Date());
          gtag('config', 'G-9KBM90K2TM');
          window.gtag = gtag;

          // 2. Meta Pixel (ID: 1640189624147202)
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
          document,'script','https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '1640189624147202');
          fbq('track', 'PageView');
        }

        ['scroll', 'keydown', 'touchstart', 'click', 'mousemove'].forEach(function (e) {
          window.addEventListener(e, loadTrackers, { once: true, passive: true });
        });

        // 3. Idle fallback: load after 3.5s so non-scrolling visitors are captured
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function () {
            setTimeout(loadTrackers, 3500);
          });
        } else {
          setTimeout(loadTrackers, 4000);
        }
      })();
    </script>
