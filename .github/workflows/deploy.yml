name: Deploy to Hostinger

# Replaces the previous GitHub Pages workflow: uncodedhub.com is served
# from Hostinger, not GitHub Pages, so deploying to Pages never touched
# the real site. This builds the same way `npm run build` does locally
# (sitemap generation, then the Vite build, then prerendering every
# route to static HTML) and rsyncs the result straight into
# public_html over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The prerender step drives a real Chromium instance; the browser
      # binary + its OS-level libraries aren't part of `npm ci`.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (sitemap + vite build + prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BOOKING_SECRET: ${{ secrets.VITE_BOOKING_SECRET }}

      - name: Deploy to Hostinger via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # No --delete: a route removed from the app leaves its old
          # static file on the server instead of being cleaned up. Safer
          # default for now (nothing outside dist/ can ever be touched);
          # revisit if stale leftover routes become an actual problem.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            dist/ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_REMOTE_PATH }}/"
